- name: Update dotfiles on Remote PVE server and all remote VMs/LXCs
  hosts: remotepvelxc
  tasks:
    - name: Run updatedotfiles.sh script on services hosts at remote site
      ansible.builtin.command: ./updatedotfiles.sh
      args:
        chdir: "{{ ansible_facts['env']['HOME'] }}/dotfiles/common/ansible/clientscripts"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
