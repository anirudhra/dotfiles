- name: Update dotfiles on Remote PVE server and all remote VMs/LXCs
  hosts: remotepvelxc
  tasks:
    - name: Run updatedotfiles.sh script on services hosts at remote site
      ansible.builtin.script: "{{ playbook_dir }}/../clientscripts/updatedotfiles.sh"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
