- name: Update PVE Server at remote site
  hosts: remotepve
  tasks:
    - name: Run upgrade.sh script on PVE Server at remote site
      ansible.builtin.command: ./upgrade.sh
      args:
        chdir: "{{ ansible_facts['env']['HOME'] }}/dotfiles/common/ansible/clientscripts"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
