- name: Update dotfiles across all local and remote servers, LXCs, and VMs
  hosts: updatedfeverywhere
  tasks:
    - name: Run updatedotfiles.sh script on all hosts
      ansible.builtin.script: "{{ playbook_dir }}/../clientscripts/updatedotfiles.sh"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
