- name: Update all PVE services
  hosts: upgradepveall
  tasks:
    - name: Run upgrade.sh script on remote services hosts
      ansible.builtin.command: ./upgrade.sh
      args:
        chdir: "{{ ansible_env.HOME }}/dotfiles/common/ansible/clientscripts"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
