- name: Update all remote site LXCs
  hosts: remotelxc
  tasks:
    - name: Run upgrade.sh script on services hosts at remote site
      ansible.builtin.command: ./upgrade.sh
      args:
        chdir: "{{ ansible_env.HOME }}/dotfiles/common/ansible/clientscripts"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
