- name: Update all remote site PVE server and LXCs
  hosts: remotepvelxc
  tasks:
    - name: Run upgrade.sh script on services hosts at remote site
      ansible.builtin.command: ./upgrade.sh
      args:
        chdir: "{{ ansible_facts['env']['HOME'] }}/dotfiles/common/ansible/clientscripts"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
