- name: Update dotfiles on local PVE server, router and VMs/LXCs
  hosts: updatedfall
  tasks:
    - name: Run updatedotfiles.sh script on remote services hosts
      ansible.builtin.script: "{{ playbook_dir }}/../clientscripts/updatedotfiles.sh"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
