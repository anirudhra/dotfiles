- name: Update dotfiles on local PVE server, router and VMs/LXCs
  hosts: updatedfall
  tasks:
    - name: Run updatedotfiles.sh script on remote services hosts
      ansible.builtin.command: ./updatedotfiles.sh
      args:
        chdir: "{{ ansible_env.HOME }}/dotfiles/common/ansible/clientscripts"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
