- name: Fix IoT IP addresses on HA after router reboot
  hosts: ha
  tasks:
    - name: Restore device entries from backup file
      ansible.builtin.copy:
        src: /root/homeassistant/.storage/core.config_entries.backup
        dest: /root/homeassistant/.storage/core.config_entries
        remote_src: true
        force: true

    - name: Safely reboot Home Assistant host and wait for reconnect
      ansible.builtin.reboot:
        reboot_timeout: 300
