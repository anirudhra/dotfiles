- name: Update dotfiles on all remote LXCs
  hosts: remotelxc
  tasks:
    - name: Run updatedotfiles.sh script on services hosts at remote site
      ansible.builtin.command: ./updatedotfiles.sh
      args:
        chdir: "{{ ansible_env.HOME }}/dotfiles/common/ansible/clientscripts"
      register: out

    - ansible.builtin.debug:
        var: out.stdout_lines
